<body>

  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

    S('Selisih', '-2.479.848,36'), S('Saldo Awal', '23.181.095,74'), T('Saldo Akhir', '20.701.247,38')\n      ] },\n      aruskas: { label: 'Arus Kas', title: 'Laporan Arus Kas', period: end25, rows: [\n        H('Arus Kas Operasi'), G('Penerimaan'), R('Zakat Harta', '3.350.000,00'), R('Zakat Profesi', '27.560.000,00'), R('Zakat Fitrah', '691.000,00'), R('Infaq', '21.279.088,00'), R('Sadaqah', '15.000,00'), R('Fidyah', '400.000,00'), T('Total Penerimaan', '53.295.088,00'),\n        G('Pengeluaran'), R('Penyaluran Zakat Harta', '3.650.000,00'), R('Penyaluran Zakat Profesi', '20.850.000,00'), R('Penyaluran Zakat Perniagaan', '400.000,00'), R('Penyaluran Infaq', '4.200.000,00'), R('Penyaluran Sadaqah', '500.000,00'), R('Penggunaan Dana Amil', '5.270.869,78'), T('Total Pengeluaran', '34.870.869,78'),\n        S('Selisih Arus Kas Operasi Bersih', '18.424.218,22'),\n        H('Arus Kas Non Operasi'), G('Penerimaan'), R('Pendapatan Lain', '25.374,86'), T('Total Penerimaan', '25.374,86'),\n        G('Pengeluaran'), T('Total Pengeluaran', '0,00'),\n        S('Selisih Arus Kas Non Operasi Bersih', '25.374,86'),\n        S('Selisih', '18.449.593,08'), S('Saldo Awal', '3.351.771,96'), T('Saldo Akhir', '21.801.365,04')\n      ] }\n    };\n    const repOrder = ['posisi', 'zakat', 'infaq', 'sadaqah', 'fidyah', 'wakaf', 'amil', 'aruskas'];\n    const rep = reports[st.rep] ? st.rep : 'posisi';\n    const rtypes = repOrder.map((id) => ({ id, label: reports[id].label, pressed: rep === id ? 'true' : 'false', pick: () => this.setState({ rep: id }) }));\n    const clsOf = { r: '', h: ' lz-rr-h', g: ' lz-rr-g', s: ' lz-rr-s', t: ' lz-rr-t' };\n    const report = { title: reports[rep].title, period: reports[rep].period, rows: reports[rep].rows.map((x) => ({ label: x.label, val: x.val, cls: 'lz-rr' + clsOf[x.kind] })) };\n\n    const tabs = [['zakat', 'Zakat'], ['infaq', 'Infaq'], ['sedekah', 'Sedekah'], ['fidyah', 'Fidyah'], ['kurban', 'Kurban']]\n      .map(([id, label]) => ({ id, label, pressed: tab === id ? 'true' : 'false', pick: () => this.setState({ tab: id }) }));\n\n    const rtabs = [['penerimaan', 'Penerimaan'], ['penyaluran', 'Penyaluran']]\n      .map(([id, label]) => ({ id, label, pressed: rtab === id ? 'true' : 'false', pick: () => this.setState({ rtab: id }) }));\n\n    const bP = (t) => ({ k: 'p', t });\n    const bLead = (t) => ({ k: 'lead', t });\n    const bH = (t) => ({ k: 'h', t });\n    const bSh = (n, t) => ({ k: 'sh', n, t });\n    const bUl = (items) => ({ k: 'ul', items });\n    const bQ = (t, c) => ({ k: 'q', t, c });\n    const bCo = (t) => ({ k: 'co', t });\n    const bSrc = (t) => ({ k: 'n', t });\n    const bTl = (tiles) => ({ k: 'tl', tiles });\n\n    const data = {\n      zakat: [\n        {\n          title: 'Zakat Harta', total: '42.338.300,00', cta: 'ZakatNow', calc: true,\n          blocks: [\n            bQ('Ambillah zakat dari sebagian harta mereka, dengan zakat itu kamu membersihkan dan mensucikan mereka …', 'QS At-Taubah: 103'),\n            bLead('Zakat merupakan kewajiban bagi setiap muslim yang telah memenuhi persyaratan tertentu, yaitu berupa pengambilan dari harta yang kita miliki. Besaran zakat adalah hanya 2,5% dari harta kita yang menjadi hak orang yang berhak menerima zakat (mustahiq).'),\n            bTl([{ v: '2,5%', l: 'Besaran zakat harta' }]),\n            bP('Dengan zakat yang telah ditunaikan, selain telah menjemput keberkahan risiko juga melepaskan diri dari ancaman hukuman bagi yang tidak membayarkan zakat.'),\n            bP('Lazismu KL Masjid Al Mujahidin mengelola zakat maal Anda sehingga berdaya guna efektif dan efisien untuk meningkatkan kualitas hidup para mustahiq menjadi lebih baik.')\n          ]\n        },\n        {\n          title: 'Zakat Profesi', total: '97.390.950,00', cta: 'ZakatNow', calc: true,\n          blocks: [\n            bQ('Hai orang yang beriman, nafkahkanlah sebagian dari hasil usahamu yang baik-baik', 'QS Al-Baqarah: 267'),\n            bLead('Zakat Penghasilan atau Zakat Profesi adalah zakat yang dikenakan atas penghasilan dari suatu profesi seorang muslim. Profesi adalah setiap pekerjaan yang menghasilkan uang, baik dilakukan sendiri (wiraswasta) untuk mendapatkan hasil usaha atau dilakukan bersama serta tergantung pada pihak lain (seperti bekerja sebagai pegawai) untuk mendapatkan upah.'),\n            bTl([{ v: '2,5%', l: 'Dari total penghasilan per periode' }]),\n            bP('Zakat Profesi besarnya adalah 2,5% dari total penghasilan dalam suatu periode waktu, bisa dilakukan secara bulanan, kuartalan, semesteran atau tahunan. Tentunya cara penunaian zakat penghasilan harus disesuaikan sehingga mudah dalam melaksanakannya.')\n          ]\n        },\n        {\n          title: 'Zakat Harta Temuan', total: '', cta: 'ZakatNow', calc: true,\n          blocks: [\n            bQ('… dan pada rikaz (diwajibkan zakatnya) satu perlima.', 'Dari Abu Hurairah r.a., bahwa Rasulullah s.a.w. bersabda · Hadith Sahih, riwayat Bukhari'),\n            bLead('Harta temuan (rikaz) adalah harta yang ditemukan terpendam dalam tanah, biasa disebut juga sebagai harta karun. Termasuk di dalamnya barang yang ditemukan dan tidak ada pemiliknya.'),\n            bTl([{ v: '20%', l: 'Atau 1/5 dari nilai barang' }, { v: '85 gr', l: 'Nisab emas' }]),\n            bP('Nizab rikaz sama dengan emas dan perak, kewajiban zakatnya tidak disyaratkan berulang tahun tetapi wajib dikeluarkan 1/5 atau 20% dari nilai barang.'),\n            bP('Harta yang diperoleh sebagai rezeki tidak terduga (tanpa usaha), atau memperoleh hadiah (yang tidak mengandung unsur judi), merupakan salah satu sebab kepemilikan atas harta tersebut dan dapat diqiaskan sebagai harta temuan atau riqaz. Maka apabila harta tersebut telah melebihi nisab 85 gr emas, maka wajib zakat atasnya sebesar 20% yang harus ditunaikan saat memperolehnya, setelah dikurangi biaya-biaya dan pajak.')\n          ]\n        },\n        {\n          title: 'Zakat Fitrah Ramadhan', total: '38.595.500,00', cta: 'ZakatNow', calc: true,\n          blocks: [\n            bTl([{ v: '2,5 kg', l: 'Atau 3,5 liter beras per jiwa' }, { v: 'Rp 45.000–47.000', l: 'Per jiwa, ketetapan BAZNAS 2025' }]),\n            bH('Pengantar'),\n            bUl([\n              'Zakat fitrah merupakan zakat yang wajib dikeluarkan oleh setiap muslim, baik laki-laki maupun perempuan, anak-anak maupun orang dewasa, yang beragama Islam dan memiliki kelebihan rezeki untuk memenuhi kebutuhan pokoknya dan keluarganya di malam dan hari raya Idul Fitri.',\n              'Zakat fitrah bertujuan untuk membersihkan jiwa setelah berpuasa di bulan Ramadhan dan membantu fakir miskin agar mereka juga bisa merasakan kebahagiaan di hari raya.',\n              'Zakat fitrah harus dikeluarkan sebelum shalat Idul Fitri.'\n            ]),\n            bH('Besaran'),\n            bUl([\n              'Besaran zakat fitrah adalah satu sha’ atau sekitar 2,5 kg atau 3,5 liter beras atau makanan pokok lainnya yang biasa dikonsumsi di daerah tersebut.',\n              'Jika ingin membayar dengan uang, maka nominalnya disesuaikan dengan harga beras atau makanan pokok yang berlaku di daerah tersebut.',\n              'Badan Amil Zakat Nasional (BAZNAS) telah menetapkan besaran zakat fitrah tahun 2025 sebesar 2,5 kg atau 3,5 liter beras atau setara dengan Rp 45.000–Rp 47.000 per jiwa.'\n            ]),\n            bH('Waktu Pelunasan'),\n            bUl([\n              'Zakat fitrah dibayarkan sejak awal bulan Ramadhan dan paling lambat sebelum pelaksanaan shalat Idul Fitri.',\n              'Lazismu menyarankan untuk menyegerakan pembayaran zakat fitrah, satu atau dua hari sebelum hari Raya Idul Fitri.'\n            ])\n          ]\n        }\n      ],\n      infaq: [\n        {\n          title: 'Infaq', total: '24.042.859,00', cta: 'InfaqNow', calc: false,\n          blocks: [\n            bQ('Siapa yang bersedekah dengan sebiji korma yang berasal dari usahanya yang halal lagi baik (Allah tidak menerima kecuali dari yang halal lagi baik), maka sesungguhnya Allah menerima sedekah tersebut dengan tangan kanan-Nya kemudian Allah menjaga dan memeliharanya untuk pemiliknya seperti seseorang di antara kalian yang menjaga dan memelihara anak kudanya. Hingga sedekah tersebut menjadi sebesar gunung.', 'Dari Abu Huraira RA, Rasulullah SAW bersabda · Muttafaqun ’alaih'),\n            bLead('Infaq adalah mengeluarkan atau membelanjakan sebagian dari harta yang dimiliki oleh seorang muslim.'),\n            bH('Infaq terdiri dari 2 (dua) jenis'),\n            bTl([{ v: 'Infaq wajib', d: 'Antara lain kafarat, nazar dan zakat' }, { v: 'Infaq sunnah', d: 'Antara lain pemberian kepada fakir miskin, dan korban bencana' }]),\n            bP('Ayo berinfaq melalui Lazismu KL Masjid Al Mujahidin.')\n          ]\n        },\n        {\n          title: 'Kotak Amal Masjid Al Mujahidin', total: '9.088.016,00', cta: 'InfaqNow', calc: false,\n          blocks: [\n            bLead('Kotak Amal Masjid Al Mujahidin adalah program alternatif untuk menunaikan infaq kepada Masjid Al Mujahidin dari cara konvensional melalui kotak amal yang selama ini dilakukan para jamaah.'),\n            bP('Program ini juga dirancang untuk menampung infaq jamaah yang masuk ke rekening bank Lazismu KL Masjid Al Mujahidin melalui transfer atau pembayaran QRIS yang tidak melakukan konfirmasi pembayaran.'),\n            bP('Lazismu KL Masjid Al Mujahidin secara berkala akan menyampaikan laporan dan menyerahkan dana yang terkumpul dari program ini kepada DKM Al Mujahidin.')\n          ]\n        },\n        {\n          title: 'Infaq Kemanusiaan Peduli Palestina', total: '21.275.000,00', cta: 'InfaqNow', calc: false,\n          blocks: [\n            bLead('Program Infaq Kemanusiaan Peduli Palestina adalah program yang dirancang untuk mengumpulkan infaq atau donasi yang ditujukan untuk membantu saudara-saudara kita yang berada di tanah Palestina. Program pengumpulan dana ini akan berlangsung hingga akhir 2026.'),\n            bTl([{ v: 'Akhir 2026', l: 'Batas waktu pengumpulan dana' }]),\n            bP('Donasi yang terkumpul secara periodik akan disampaikan ke Lazismu Kota Depok untuk selanjutnya akan dikirim ke Palestina melalui saluran resmi.'),\n            bP('Ayo bantu meringankan beban saudara-saudara kita yang berada di Palestina.')\n          ]\n        },\n        {\n          title: 'Infaq Operasional Mushalla Al Manar', total: '210.000,00', cta: 'InfaqNow', calc: false,\n          blocks: [\n            bLead('Mushalla Al Manar berdiri sekitar 45 tahun lalu.'),\n            bP('Mushalla berada di RT 02 RW 06 Kel Kukusan, Kec Beji, Kota Depok, Jawa Barat, Indonesia.'),\n            bP('Mushalla mempunyai kegiatan yang dilakukan secara rutin antara lain:'),\n            bUl(['Shalat berjamaah', 'Taman Pengajian Anak-anak (TPA)', 'Pengajian Dua Pekanan Ba’da Subuh Tasbih']),\n            bP('Untuk menjalankan semua kegiatan tersebut mushalla membutuhkan pendanaan rutin sekitar IDR 3.000.000 per bulan.'),\n            bTl([{ v: '± IDR 3.000.000', l: 'Kebutuhan pendanaan per bulan' }]),\n            bP('Ayo berinfaq untuk meringankan beban pengurus Mushalla Al Manar.')\n          ]\n        }\n      ],\n      sedekah: [\n        {\n          title: 'Sedekah', total: '1.132.500,00', cta: 'SadaqahNow', calc: false,\n          blocks: [\n            bLead('Sedekah merupakan amalan yang dicintai Allah SWT. Hal ini dibuktikan dengan banyaknya ayat Al-Qur’an yang menyebutkan tentang sedekah, salah satunya dalam surat Al-Baqarah ayat 271,'),\n            bQ('Jika kamu menampakkan sedekah (mu), maka itu adalah baik sekali. Dan jika kamu menyembunyikannya dan kamu berikan kepada orang-orang fakir, maka menyembunyikan itu lebih baik bagimu. Dan Allah akan menghapuskan dari kamu sebagian kesalahan-kesalahanmu, dan Allah mengetahui apa yang kamu kerjakan', 'QS. Al-Baqarah: 271'),\n            bH('Keutamaan Sedekah'),\n            bSh('1', 'Sedekah Tidak Mengurangi Harta'),\n            bP('Sedekah adalah ibadah yang tidak akan mengurangi harta, sebagaimana Rasulullah SAW bersabda untuk mengingatkan kita dalam sebuah riwayat Muslim, “sedekah tidaklah mengurangi harta.” (HR. Muslim). Mengapa sedekah tidak akan mengurangi harta? Karena meskipun secara tersurat harta terlihat berkurang, namun kekurangan tersebut akan ditutup dengan pahala di sisi Allah SWT dan akan terus bertambah kelipatannya menjadi lebih banyak. Hal ini merupakan janji Allah yang termaktub dalam surat Saba,'),\n            bQ('Dan barang apa saja yang kamu nafkahkan, maka Allah akan menggantinya dan Dia-lah pemberi rezeki sebaik-baiknya.', 'QS. Saba’: 39'),\n            bSh('2', 'Sedekah Menghapus Dosa'),\n            bP('Sebagai makhluk Allah SWT yang tak luput dari dosa, umat Islam senantiasa diberikan berbagai keistimewaan agar berkesempatan untuk bertaubat dan menghapus dosa-dosanya dengan cara yang diridhai oleh-Nya. Salah satunya dengan sedekah.'),\n            bP('Sedekah merupakan ibadah yang istimewa, ia dapat memudahkan kita dalam menghapus dosa-dosa. Rasulullah SAW pernah bersabda,'),\n            bQ('Sedekah itu dapat menghapus dosa sebagaimana air itu memadamkan api.', 'HR. At-Tirmidzi'),\n            bSh('3', 'Sedekah Melipatgandakan Pahala'),\n            bP('Sedekah memberikan banyak keistimewaan kepada pelakunya, salah satu di antaranya adalah Allah SWT akan memberikan pahala yang banyak untuk orang yang bersedekah. Allah SWT berfirman,'),\n            bQ('Sesungguhnya orang-orang yang bersedekah baik laki-laki maupun perempuan dan meminjamkan kepada Allah pinjaman yang baik, niscaya akan dilipat-gandakan (ganjarannya) kepada mereka; dan bagi mereka pahala yang banyak.', 'QS. Al-Hadid: 18'),\n            bSrc('Sumber: baznas.go.id')\n          ]\n        }\n      ],\n      fidyah: [\n        {\n          title: 'Fidyah Puasa Ramadhan', total: '4.600.000,00', cta: 'FidyahNow', calc: false,\n          blocks: [\n            bLead('Fidyah adalah denda yang wajib dibayarkan karena seorang muslim meninggalkan kewajiban berpuasa di bulan Ramadhan. Denda dimaksud berupa pemberian yang diberikan kepada orang-orang yang membutuhkan.'),\n            bTl([{ v: '675 g', l: '1 mud · Imam Malik dan As-Syafi’i' }, { v: '1,5 kg', l: '½ sha’ · Ulama Hanafiyah' }, { v: 'Rp 60.000', l: 'Per hari per jiwa · SK BAZNAS 2023' }]),\n            bP('Fidyah dapat berupa bahan makanan pokok dalam ukuran tertentu.'),\n            bUl([\n              'Menurut Imam Malik dan Imam As-Syafi’i, fidyah yang harus dibayarkan sebesar 1 mud gandum (kira-kira 6 ons = 675 gram = 0,75 kg atau seukuran telapak tangan yang ditengadahkan saat berdoa).',\n              'Sedangkan menurut Ulama Hanafiyah, fidyah yang harus dikeluarkan sebesar 2 mud atau setara 1/2 sha’ gandum. (Jika 1 sha’ setara 4 mud = sekitar 3 kg, maka 1/2 sha’ berarti sekitar 1,5 kg).',\n              'Namun fidyah juga bisa dibayarkan dalam bentuk uang. Menurut kalangan Hanafiyah, fidyah boleh dibayarkan dalam bentuk uang sesuai dengan takaran yang berlaku seperti 1,5 kilogram makanan pokok per hari dikonversi menjadi rupiah.'\n            ]),\n            bP('Lalu, bagaimanakah cara membayar fidyah dengan uang dan apa saja ketentuan yang ada di dalamnya?'),\n            bCo('Berdasarkan SK Ketua BAZNAS No. 07 Tahun 2023 tentang Zakat Fitrah dan Fidyah untuk wilayah Jakarta dan sekitarnya, ditetapkan bahwa nilai fidyah dalam bentuk uang sebesar Rp 60.000 per hari per jiwa.'),\n            bP('Silakan hitung berapa rupiah fidyah yang wajib ditunaikan, lalu klik FidyahNow untuk menunaikannya melalui kami.'),\n            bSrc('Sumber: baznas.go.id')\n          ]\n        }\n      ],\n      kurban: [\n        {\n          title: 'QurbanMu Bahagiakan Sesama', total: '3.300.000,00', cta: 'KurbanNow', calc: false,\n          blocks: [\n            bLead('QurbanMu Kemasan Lazismu Jawa Barat merupakan program inovasi qurban yang diolah menjadi produk berupa rendang kemasan. Produk RendangMu menjadi solusi kebutuhan ketahanan pangan sepanjang tahun sebab memiliki daya tahan yang cukup lama.'),\n            bH('Tujuan'),\n            bUl([\n              'Mengenalkan Lazismu kepada masyarakat secara luas dan mengenalkan program “QurbanMu Bahagiakan Sesama”.',\n              'Mengajak masyarakat berqurban melalui Lazismu.',\n              'Mengajak masyarakat internal maupun eksternal Muhammadiyah terlibat dalam pelaksanaan fundraising dan penyaluran program “QurbanMu Bahagiakan Sesama”.',\n              'Memberikan kemudahan layanan dalam menunaikan ibadah Qurban.',\n              'Mendistribusikan qurban secara adil, merata dan fokus pada sasaran prioritas.'\n            ]),\n            bH('Paket'),\n            bTl([\n              { v: 'Rp 3.300.000', l: 'Setara 1 kambing', d: 'Akan menjadi 60 kaleng RendangMu, 18 kaleng di antaranya akan diserahkan ke pengurban.' },\n              { v: 'Rp 21.500.000', l: 'Setara 1 sapi', d: 'Akan menjadi 420 kaleng RendangMu, 126 kaleng di antaranya akan diserahkan ke pengurban.' }\n            ])\n          ]\n        }\n      ]\n    };\n\n    const list = data[tab] || [];\n    const tabLabel = (tabs.find((x) => x.id === tab) || {}).label || '';\n    const two = (n) => String(n).padStart(2, '0');\n    const mapBlock = (b) => ({\n      isQ: b.k === 'q', isLead: b.k === 'lead', isP: b.k === 'p', isH: b.k === 'h', isSh: b.k === 'sh',\n      isUl: b.k === 'ul', isTl: b.k === 'tl', isCo: b.k === 'co', isN: b.k === 'n',\n      t: b.t || '', c: b.c || '', hasC: !!b.c, n: b.n || '',\n      cls: b.k === 'q' ? ('lz-q' + ((b.t || '').length > 170 ? ' lz-q-long' : '')) : '',\n      tlCls: 'lz-tl lz-tl-' + (b.tiles || []).length,\n      lis: (b.items || []).map((t) => ({ t })),\n      tiles: (b.tiles || []).map((x) => ({ v: x.v || '', l: x.l || '', hasL: !!x.l, d: x.d || '', hasD: !!x.d }))\n    });\n    const programs = list.map((p, i) => ({\n      title: p.title,\n      kicker: list.length > 1 ? tabLabel + ' · ' + two(i + 1) + ' / ' + two(list.length) : tabLabel,\n      total: p.total || '',\n      hasTotal: !!p.total,\n      cta: p.cta,\n      calc: !!p.calc,\n      blocks: p.blocks.map(mapBlock)\n    }));\n    const tabCount = list.length + ' program';\n\n    // ---- Galeri penyaluran ---------------------------------------------\n    // Ganti isi daftar ini dengan foto asli: src (mis. 'foto/penyaluran-01.jpg'), title, meta, cap.\n    // Selama src kosong, yang tampil adalah bingkai penanda.\n    const gallery = Array.from({ length: 12 }, (_, i) => ({\n      src: '',\n      title: 'Judul Kegiatan',\n      meta: 'Tanggal · Program',\n      cap: 'Tulis keterangan kegiatan di sini: lokasi, jumlah penerima manfaat, dan jenis bantuan yang disalurkan.'\n    }));\n    const gTotal = gallery.length;\n    const PAGE = 6;\n    const gShown = Math.min(st.shown || PAGE, gTotal);\n    const lbIdx = Math.min(Math.max(st.lb || 0, 0), gTotal - 1);\n    const lbEl = () => document.getElementById('lzlb');\n    const openLb = (i) => () => {\n      this.setState({ lb: i });\n      const d = lbEl();\n      if (d && !d.open && d.showModal) d.showModal();\n    };\n    const photos = gallery.slice(0, gShown).map((g, i) => ({\n      src: g.src,\n      hasSrc: !!g.src,\n      title: g.title,\n      meta: g.meta,\n      label: 'Foto ' + two(i + 1),\n      aria: 'Buka foto ' + (i + 1) + ' dari ' + gTotal + ': ' + g.title,\n      open: openLb(i)\n    }));\n    const gMore = gShown < gTotal;\n    const galStatus = 'Menampilkan ' + gShown + ' dari ' + gTotal + ' foto';\n    const toggleMore = () => this.setState({ shown: gMore ? Math.min(gShown + PAGE, gTotal) : PAGE });\n    const cur = gallery[lbIdx];\n    const lb = { src: cur.src, hasSrc: !!cur.src, title: cur.title, meta: cur.meta, cap: cur.cap, label: 'Foto ' + two(lbIdx + 1), n: two(lbIdx + 1) + ' / ' + two(gTotal) };\n    const lbGo = (d) => this.setState({ lb: (lbIdx + d + gTotal) % gTotal });\n    const lbClose = () => { const d = lbEl(); if (d && d.open) d.close(); };\n    const lbBackdrop = (e) => { if (e && e.target === lbEl()) lbClose(); };\n    const lbKey = (e) => {\n      if (!e) return;\n      if (e.key === 'ArrowRight') { e.preventDefault(); lbGo(1); }\n      else if (e.key === 'ArrowLeft') { e.preventDefault(); lbGo(-1); }\n    };\n\n    // Kabar: ganti src dengan foto asli (mis. 'foto/kabar-01.jpg'); kosongkan untuk placeholder.\n    const newsRaw = [\n      { src: '', date: '19 Maret 2024', title: 'Penyusunan Laporan Keuangan Kuartal 1 2024', body: 'Pengurus menggelar rapat pada akhir Maret untuk menyusun laporan keuangan kuartal 1 2024, dihadiri Ketua Ranting Muhammadiyah Kukusan H Zakaria Asmat dan Ketua DKM H Rustam Effendie. Penyaluran dilaksanakan pada Kamis, 4 April.' },\n      { src: '', date: 'Enam jenis zakat', title: 'Tunaikan Zakat di Lazismu KL Masjid Al Mujahidin', body: 'Zakat adalah rukun Islam ke-3. Lazismu KL Masjid Al Mujahidin menerima enam jenis zakat: Mal atau Harta, Penghasilan atau Profesi, Pertanian, Perniagaan, Barang Temuan dan Fitrah.' },\n      { src: '', date: \"Ahad, 3 Rabi'ul Awwal 1445 H / 17 September 2023\", title: 'Peluncuran Aplikasi Pengelolaan Lazismu KL', body: 'Aplikasi web berstandar pelaporan Lazismu ini dilengkapi modul pendataan mustahiq. Pembayaran online direncanakan mulai 20 Oktober.' },\n      { src: '', date: 'Tanggal Berita', title: 'Judul Berita 04', body: 'Tulis isi berita di sini. Ganti judul, tanggal, foto, dan isi ini dengan berita yang akan dipublikasikan.' },\n      { src: '', date: 'Tanggal Berita', title: 'Judul Berita 05', body: 'Tulis isi berita di sini. Ganti judul, tanggal, foto, dan isi ini dengan berita yang akan dipublikasikan.' },\n      { src: '', date: 'Tanggal Berita', title: 'Judul Berita 06', body: 'Tulis isi berita di sini. Ganti judul, tanggal, foto, dan isi ini dengan berita yang akan dipublikasikan.' }\n    ];\n    const news = newsRaw.map((n, i) => ({\n      src: n.src,\n      hasSrc: !!n.src,\n      alt: 'Foto berita: ' + n.title,\n      label: 'Foto Berita ' + two(i + 1),\n      date: n.date,\n      title: n.title,\n      body: n.body\n    }));\n\n    const nwEl = () => document.getElementById('lznw');\n    const nwStep = (dir) => () => {\n      const el = nwEl();\n      if (!el) return;\n      const card = el.querySelector('.lz-nw-c');\n      const gap = parseFloat(getComputedStyle(el).columnGap) || 24;\n      const step = card ? card.getBoundingClientRect().width + gap : el.clientWidth;\n      const max = el.scrollWidth - el.clientWidth;\n      let x = el.scrollLeft + dir * step;\n      if (dir > 0 && el.scrollLeft >= max - 4) x = 0;\n      else if (dir < 0 && el.scrollLeft <= 4) x = max;\n      el.scrollTo({ left: x, behavior: 'smooth' });\n    };\n\n    const FUND = [['Zakat', 196609750], ['Infaq', 84556966], ['Fidyah', 4600000], ['Wakaf', 3849000], ['Kurban', 3300000], ['Sadaqah', 1132500]];\n    const rp = (n) => String(n).replace(/\\B(?=(\\d{3})+(?!\\d))/g, '.');\n    const pc = (sh) => (sh * 100).toFixed(1).replace('.', ',') + '%';\n    const fTotal = FUND.reduce((sum, f) => sum + f[1], 0);\n    const dn = st.dn == null ? 0 : st.dn;\n    const bars = FUND.map(([label, n], i) => {\n      const sh = n / fTotal;\n      return {\n        label,\n        rank: '0' + (i + 1),\n        val: rp(n),\n        pct: pc(sh),\n        w: (sh * 100).toFixed(2) + '%',\n        pressed: dn === i ? 'true' : 'false',\n        pick: () => this.setState({ dn: i })\n      };\n    });\n    const fCur = bars[dn];\n    const fCurSh = FUND[dn][1] / fTotal;\n    const sel = {\n      label: fCur.label,\n      val: fCur.val,\n      pct: fCur.pct,\n      dash: Math.max(fCurSh * 100, 0.8).toFixed(2) + ' 100',\n      aria: fCur.label + ': ' + fCur.pct + ' dari total terhimpun, Rp ' + fCur.val\n    };\n    const fundTotal = rp(fTotal);\n    const fundCount = FUND.length;\n\n    return {\n      tabs,\n      programs,\n      tabCount,\n      photos,\n      news,\n      newsPrev: nwStep(-1),\n      newsNext: nwStep(1),\n      galStatus,\n      showMoreBtn: gTotal > PAGE,\n      moreLabel: gMore ? 'Lihat Lebih Banyak' : 'Tampilkan Lebih Sedikit',\n      moreExpanded: gMore ? 'false' : 'true',\n      toggleMore,\n      lb,\n      lbPrev: () => lbGo(-1),\n      lbNext: () => lbGo(1),\n      lbClose,\n      lbBackdrop,\n      lbKey,\n      bars,\n      sel,\n      fundTotal,\n      fundCount,\n      rtabs,\n      rtypes,\n      report,\n      showIn: rtab === 'penerimaan',\n      showOut: rtab === 'penyaluran',\n      menuOpen: menu,\n      menuClosed: !menu,\n      menuExpanded: menu ? 'true' : 'false',\n      toggleMenu: () => this.setState({ menu: !menu }),\n      closeMenu: () => this.setState({ menu: false })\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n"</script>
